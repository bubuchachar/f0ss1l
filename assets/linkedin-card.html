<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1080px;
      height: 1080px;
      margin: 0 auto;
      background-color: #0d1117;
      background-image: url("data:image/svg+xml,%3Csvg width='40' height='40' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='20' cy='20' r='1.5' fill='%2300FF41' fill-opacity='0.08'/%3E%3C/svg%3E");
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: 'Share Tech Mono', monospace;
      color: #4DFF7C;
    }

    /* CRT scanlines */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom, transparent, transparent 3px,
        rgba(0,0,0,0.08) 3px, rgba(0,0,0,0.08) 4px
      );
      pointer-events: none;
    }

    .inner {
      width: 880px;
      text-align: center;
    }

    .border-line {
      color: #1A6B35;
      font-size: 13px;
      letter-spacing: 2px;
      margin: 20px 0;
      opacity: 0.7;
    }

    .logo svg {
      width: 520px;
      height: auto;
      fill: #00FF41;
      filter: drop-shadow(0 0 12px rgba(0,255,65,0.9)) drop-shadow(0 0 32px rgba(0,255,65,0.4));
      margin: 24px 0 32px;
    }

    .tagline {
      font-size: 13px;
      color: #1A6B35;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin: 0 0 20px;
      opacity: 0.7;
    }

    .copy {
      margin-top: 64px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .line1 {
      font-size: 28px;
      color: #4DFF7C;
      line-height: 1.6;
    }

    .line2 {
      font-size: 28px;
      color: #00FF41;
      text-shadow: 0 0 8px rgba(0,255,65,0.8);
    }

    .url {
      font-size: 16px;
      color: #4DFF7C;
      opacity: 0.4;
      margin-top: 48px;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <div class="inner">
    <div class="border-line">+++ ──────────────────────────────────────────────────────────────────── +++</div>
    <div class="logo">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 67.5 10.5">
        <path d="M0,10.5V0h10.5v1.5H3v3h6v1.5H3v4.5H0Z"/>
        <path d="M13.5,10.5v-1.5h-1.5V1.5h1.5V0h7.5v1.5h1.5v7.5h-1.5v1.5h-7.5ZM15,9h4.5v-4.5h-1.5v-1.5h1.5v-1.5h-4.5v4.5h1.5v1.5h-1.5v1.5ZM16.5,6v-1.5h1.5v1.5h-1.5Z"/>
        <path d="M25.5,10.5v-1.5h-1.5v-1.5h3v1.5h4.5v-3h-6v-1.5h-1.5V1.5h1.5V0h7.5v1.5h1.5v1.5h-3v-1.5h-4.5v3h6v1.5h1.5v3h-1.5v1.5h-7.5Z"/>
        <path d="M37.5,10.5v-1.5h-1.5v-1.5h3v1.5h4.5v-3h-6v-1.5h-1.5V1.5h1.5V0h7.5v1.5h1.5v1.5h-3v-1.5h-4.5v3h6v1.5h1.5v3h-1.5v1.5h-7.5Z"/>
        <path d="M48,10.5v-1.5h3V3h-1.5v-1.5h1.5V0h3v9h3v1.5h-9Z"/>
        <path d="M58.5,10.5V0h3v9h6v1.5h-9Z"/>
      </svg>
    </div>
    <div class="tagline">abandoned comments from real codebases</div>
    <div class="border-line">+++ ──────────────────────────────────────────────────────────────────── +++</div>

    <div class="copy">
      <div class="line1">Code is written by people.<br>Some of it gets left behind.</div>
      <div class="line2">Someone's gonna ask.</div>
    </div>

    <div class="url">f0ss1l.vercel.app</div>
  </div>
</body>
</html>
